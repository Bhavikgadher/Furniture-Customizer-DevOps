apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-deployment
  namespace: furniture-customize 
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:16
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: furniture-customize-config-map
        - secretRef:
            name: furniture-customize-secrets
        readinessProbe:
            exec:
              command: 
              - pg_isready 
              - -U 
              - postgres 
            initialDelaySeconds: 15
            periodSeconds: 10

        volumeMounts:
          - name: postgresql-storage
            mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgresql-storage
          persistentVolumeClaim:
            claimName: postgresql-pvc 
