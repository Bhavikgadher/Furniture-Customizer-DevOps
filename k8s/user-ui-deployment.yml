apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-ui-deployment
  namespace: furniture-customize
  labels:
    app: user-ui
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-ui
  template:
    metadata:
      labels:
        app: user-ui
    spec:
      containers:
      - name: user-ui
        image: bhavikgadher/furniture-user-ui:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        env:
          - name: NODE_ENV
            value: "production"
          - name: PORT
            value: "8080"
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 15

