apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration-job
  namespace: furniture-customize
spec:
  template:
    spec:
      containers:
      - name: migrate
        image: bhavikgadher/furniture-customizer-backend:latest # Same image as backend
        command: ["node", "src/database/migrate.js"]
        env:
          - name: NODE_ENV
            value: "production"
        envFrom:
        - configMapRef:
            name: furniture-customize-config-map
        - secretRef:
            name: furniture-customize-secrets
      restartPolicy: OnFailure
  backoffLimit: 4
