apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-ui-deployment
  namespace: furniture-customize
  labels:
    app: admin-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-ui
  template:
    metadata:
      labels:
        app: admin-ui
    spec:
      containers:
      - name: admin-ui
        image: bhavikgadher/furniture-admin-ui:latest
        ports:
        - containerPort: 8081
        env:
          - name: NODE_ENV
            value: "production"
          - name: PORT
            value: "8081"
        readinessProbe:
          httpGet:
            path: /
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: admin-ui-service
  namespace: furniture-customize
spec:
  selector:
    app: admin-ui
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP
