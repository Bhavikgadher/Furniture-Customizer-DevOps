apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: furniture-customize
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: bhavikgadher/furniture-backend:latest
        ports:
        - containerPort: 3000
        env:
          - name: NODE_ENV
            value: "production"
          - name: PORT
            value: "3000"
        envFrom:
        - configMapRef:
            name: furniture-customize-config-map
        - secretRef:
            name: furniture-customize-secrets
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 45
          periodSeconds: 15

