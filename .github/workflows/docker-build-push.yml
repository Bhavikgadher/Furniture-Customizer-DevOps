name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, user-ui, admin-ui]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.component }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USER }}/furniture-${{ matrix.component }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "k8s/"
          target: "~/Furniture-Customizer-DevOps"

      - name: Deploy to EC2 with Kubernetes
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            cd ~/Furniture-Customizer-DevOps
            
            # Apply the Kubernetes manifests
            kubectl apply -f k8s/
            
            # Restart deployments to ensure they pull the latest images
            kubectl rollout restart deployment/backend-deployment -n furniture-customize
            kubectl rollout restart deployment/user-ui-deployment -n furniture-customize
            kubectl rollout restart deployment/admin-ui-deployment -n furniture-customize
            
            # Delete and recreate the migration job
            kubectl delete job database-migration-job -n furniture-customize --ignore-not-found
            kubectl apply -f k8s/migrate-job.yml




